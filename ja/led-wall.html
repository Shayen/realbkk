</head>
<body>
  <header class="topbar">
    <a href="/ja/index.html" title="ホーム"><img class="brand" src="/logo/REAL-bangkok3.jpg" alt="REAL Bangkok"></a>
    <div class="titles">
      <h1>LED Wall Configurator</h1>
      <p data-i18n="sub">LEDビジョンの設計・サイズ計算 — ピッチ · サイズ · 接続角度</p>
    </div>
    <div class="top-actions">
      <div class="seg lang" id="langSeg" role="group" aria-label="言語">
        <button type="button" data-v="th" lang="th" data-href="/th/led-wall.html" aria-pressed="false">TH</button>
        <button type="button" data-v="en" lang="en" data-href="/led-wall.html" aria-pressed="false">EN</button>
        <button type="button" data-v="ja" lang="ja" data-href="/ja/led-wall.html" aria-pressed="true">JP</button>
      </div>
      <a class="btn ghost" id="btnSim" href="/ja/vp-sim.html" data-i18n="btn.sim" style="text-decoration:none">撮影シミュレーター ↗</a>
      <button class="btn ghost" id="btnReset" type="button" data-i18n="btn.reset">リセット</button>
      <button class="btn ghost" id="btnLink" type="button" data-i18n="btn.link">リンクをコピー</button>
      <button class="btn" id="btnCopy" type="button" data-i18n="btn.copy">概要をコピー</button>
    </div>
  </header>

  <main class="layout">
    <!-- ============ CONTROLS ============ -->
    <aside class="panel controls">
      <section class="group">
        <h2><span class="num">1</span> Pixel Pitch</h2>
        <div class="chips" id="pitchChips"></div>
        <label class="field" id="customPitchField" hidden>
          <span data-i18n="f.customPitch">カスタムピッチ (mm)</span>
          <input type="number" id="customPitch" min="0.3" max="40" step="0.001">
        </label>
      </section>

      <section class="group">
        <h2><span class="num">2</span> <span data-i18n="sec.cabinet">キャビネットサイズ</span></h2>
        <label class="field">
          <span data-i18n="f.cabModel">キャビネット</span>
          <select id="cabSelect"></select>
        </label>
        <div class="row2">
          <label class="field"><span data-i18n="f.w">幅 (mm)</span><input type="number" id="cabW" min="50" max="3000" step="0.5"></label>
          <label class="field"><span data-i18n="f.h">高さ (mm)</span><input type="number" id="cabH" min="50" max="3000" step="0.5"></label>
        </div>
        <label class="check">
          <input type="checkbox" id="pxOverride">
          <span data-i18n="f.pxOverride">キャビネットの画素数を手動指定（メーカー仕様）</span>
        </label>
        <div class="row2" id="pxOverrideFields" hidden>
          <label class="field"><span data-i18n="f.pxW">横画素数</span><input type="number" id="cabPxW" min="1" max="4000" step="1"></label>
          <label class="field"><span data-i18n="f.pxH">縦画素数</span><input type="number" id="cabPxH" min="1" max="4000" step="1"></label>
        </div>
        <p class="hint" id="cabPxHint"></p>
      </section>

      <section class="group">
        <h2><span class="num">3</span> <span data-i18n="sec.size">画面サイズ</span></h2>
        <div class="seg" id="modeSeg">
          <button type="button" data-v="count" data-i18n="mode.count">枚数で指定</button>
          <button type="button" data-v="size" data-i18n="mode.size">サイズで指定 (m)</button>
        </div>
        <div id="countFields">
          <div class="row2">
            <label class="field"><span data-i18n="f.cols">横の枚数</span>
              <div class="stepper"><button type="button" data-step="cols:-1">−</button><input type="number" id="cols" min="1" max="100" step="1"><button type="button" data-step="cols:1">+</button></div>
            </label>
            <label class="field"><span data-i18n="f.rows">縦の枚数</span>
              <div class="stepper"><button type="button" data-step="rows:-1">−</button><input type="number" id="rows" min="1" max="100" step="1"><button type="button" data-step="rows:1">+</button></div>
            </label>
          </div>
        </div>
        <div id="sizeFields" hidden>
          <div class="row2">
            <label class="field"><span data-i18n="f.targetW">希望の幅 (m)</span><input type="number" id="targetW" min="0.1" max="100" step="0.1"></label>
            <label class="field"><span data-i18n="f.targetH">希望の高さ (m)</span><input type="number" id="targetH" min="0.1" max="50" step="0.1"></label>
          </div>
          <p class="hint" id="sizeHint"></p>
        </div>
        <label class="field">
          <span data-i18n="f.mountH">床から画面下端までの高さ (m)</span>
          <input type="number" id="mountH" min="0" max="30" step="0.1">
        </label>
      </section>

      <section class="group">
        <h2><span class="num">4</span> <span data-i18n="sec.angle">接続角度</span></h2>
        <div class="seg three" id="curveSeg">
          <button type="button" data-v="flat" data-i18n="curve.flat">フラット</button>
          <button type="button" data-v="uniform" data-i18n="curve.uniform">均等カーブ</button>
          <button type="button" data-v="custom" data-i18n="curve.custom">継ぎ目ごと</button>
        </div>
        <div id="uniformFields" hidden>
          <label class="field">
            <span data-i18n-html="f.angle">継ぎ目ごとの角度 <em class="muted">(+ 凹面 / − 凸面)</em></span>
            <div class="range-row">
              <input type="range" id="angleRange" min="-15" max="15" step="0.5">
              <input type="number" id="angle" min="-90" max="90" step="0.5">
              <span class="unit">°</span>
            </div>
          </label>
          <div class="chips small" id="anglePresets">
            <button type="button" data-a="-5">−5°</button>
            <button type="button" data-a="-2.5">−2.5°</button>
            <button type="button" data-a="2.5">+2.5°</button>
            <button type="button" data-a="5">+5°</button>
            <button type="button" data-a="7.5">+7.5°</button>
            <button type="button" data-a="10">+10°</button>
          </div>
        </div>
        <div id="customFields" hidden>
          <div class="chips small">
            <button type="button" id="jointsCorner" data-i18n="j.corner">中央に90°コーナー</button>
            <button type="button" id="jointsTwoCorner" data-i18n="j.twoCorner">コの字（90°×2）</button>
            <button type="button" id="jointsClear" data-i18n="j.clear">0°にリセット</button>
          </div>
          <div class="joints" id="jointsList"></div>
        </div>
        <p class="hint warn" id="angleWarn" hidden></p>
      </section>

      <details class="group adv">
        <summary data-i18n="adv.summary">概算値（重量 / 電力）</summary>
        <div class="row2">
          <label class="field"><span data-i18n="f.kg">重量 (kg/m²)</span><input type="number" id="kgM2" min="1" max="200" step="1"></label>
          <label class="field"><span data-i18n="f.wm2">最大電力 (W/m²)</span><input type="number" id="wM2" min="10" max="3000" step="10"></label>
        </div>
        <p class="hint" data-i18n="adv.hint">初期値は一般的な屋内キャビネットの平均値です。実際の仕様に合わせて変更してください。</p>
      </details>
    </aside>

    <!-- ============ WORKSPACE ============ -->
    <section class="workspace">
      <div class="panel viewer">
        <div class="viewer-head">
          <div class="seg tabs" id="viewTabs">
            <button type="button" data-v="3d" data-i18n="view.3d">3D表示</button>
            <button type="button" data-v="front" data-i18n="view.front">正面</button>
            <button type="button" data-v="top" data-i18n="view.top">上面</button>
          </div>
          <span class="viewer-hint" id="viewerHint" data-i18n="view.hint">ドラッグで回転 · スクロールでズーム</span>
        </div>
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="view"></canvas>
          <div class="hud" id="hud"></div>
        </div>
      </div>

      <div class="hero" id="hero"></div>
      <div class="stats" id="stats"></div>
      <p class="foot" data-i18n="foot">重量・電力・ポート数は初期計画用の概算値です。設置前にメーカー仕様をご確認ください。</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
